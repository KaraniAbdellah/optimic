# This workflow builds and pushes a Docker container to Google Artifact Registry
# and deploys it to Cloud Run when a commit is pushed to the "main" branch.

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  PROJECT_ID: 'optimic'
  REGION: 'europe-central2'

  # Cloud Run service name
  SERVICE: 'optimic-backend'
  SERVICE_ACCOUNT_EMAIL: '${{secrets.SERVICE_ACCOUNT_EMAIL}}'

  # Artifact Registry repository
  REPOSITORY: 'cloud-run-source-deploy'

  # Docker image name
  IMAGE_NAME: 'optimic-backend'

  # GitHub Secret containing your Workload Identity Provider
  WORKLOAD_IDENTITY_PROVIDER: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'


  
jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:

      # 1. Get the repository code
      - name: 'Checkout'
        uses: 'actions/checkout@v6'

      # 2. Authenticate GitHub Actions with Google Cloud
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          service_account: ${{env.SERVICE_ACCOUNT_EMAIL}}
          project_id: '${{ env.PROJECT_ID }}'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'

      # 3. Authenticate Docker with Artifact Registry
      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      # 4. Build and push Docker image
      - name: 'Build and Push Container'
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          gcloud auth configure-docker ${{env.REGION}}-docker.pkg.dev
          docker build \
            --tag "${DOCKER_TAG}" \
            ./optimic/backend

          docker push "${DOCKER_TAG}"

      # 5. Deploy the image to Cloud Run
      - name: 'Deploy to Cloud Run'
        id: 'deploy'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          env_vars: |
            ALGORITHM=${{ secrets.ALGORITHM }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            MODE_TYPE=${{ secrets.MODE_TYPE }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            QDRANT_CLOUD_API_KEY=${{ secrets.QDRANT_CLOUD_API_KEY }}
            QDRANT_CLOUD_ENDPOINT=${{ secrets.QDRANT_CLOUD_ENDPOINT }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            TOKEN_EXPIRE_DAYS=${{ secrets.TOKEN_EXPIRE_DAYS }}

      # 6. Display Cloud Run URL
      - name: 'Show output'
        run: |-
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
