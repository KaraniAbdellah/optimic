name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

  # Permet de lancer le workflow manuellement depuis GitHub
  workflow_dispatch:

env:
  PROJECT_ID: optimic
  REGION: europe-central2
  SERVICE: optimic-backend
  REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: optimic-backend

  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # 1. Récupérer le code du repository
      - name: Checkout
        uses: actions/checkout@v7


      # 2. Authentification Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}


      # 3. Authentification Docker à Artifact Registry
      - name: Docker Auth
        uses: docker/login-action@v4
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}
          registry: ${{ env.REGION }}-docker.pkg.dev


      # 4. Build + Push de l'image Docker
      - name: Build and Push Container
        run: |
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          docker build --tag "$DOCKER_TAG" .

          docker push "$DOCKER_TAG"


      # 5. Déployer l'image sur Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


      # 6. Afficher l'URL Cloud Run
      - name: Show output
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
